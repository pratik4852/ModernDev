services:

  frontend:
    build:
      context: ./Frontend/modernfrontend
      args:
        VITE_API_BASE_URL: /moderndev
    container_name: moderndev-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  backend:
    build:
      context: ./Backend
    container_name: moderndev-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env.production
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"

  mysql:
    image: mysql:8.0
    container_name: moderndev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: modern
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

volumes:
  mysql_data: